name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cbin
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: cbin_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cbin"
          --health-interval 5s --health-timeout 3s --health-retries 10
    strategy:
      matrix:
        database: [sqlite, postgres]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
        env:
          CBIN_TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://cbin:test-only@localhost:5432/cbin_test' || '' }}
      - run: python -m compileall -q src addons
